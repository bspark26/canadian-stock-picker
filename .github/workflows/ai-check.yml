name: Check AI connection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maple-ai-connection-check
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify one uncached synthetic summary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6.1-sol
          AI_MAX_SPEND_USD: '0.05'
        run: python -m scanner.check_ai
